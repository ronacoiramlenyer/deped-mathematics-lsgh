# SimBook web app: every course's SimBook in one static site (built by tools/build_site.py).
[build]
  command = "python3 tools/build_site.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
